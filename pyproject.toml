[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-loadcase-viewer"
version = "0.1.0"
description = "Parse Nastran/OptiStruct decks and render every load case: forces, supports and rigid links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seung Wook Chae" }]
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fem-loadcases = "fem_loadcase_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
